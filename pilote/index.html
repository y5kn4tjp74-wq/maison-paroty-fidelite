<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A4940">
<title>Fidélité Kiosque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Caveat:wght@700&family=Fraunces:opsz,wght@9..144,600..700&display=swap">
<style>
/* ——— Coque de la page : le téléphone du client ——— */
html, body { height: auto; }
body { background: #1B1F22; margin: 0; }
.app { max-width: 480px; margin: 0 auto; background: #F4F1EA; min-height: 100dvh; overflow-x: clip; }
</style>
<style>
/* ——— Maison Paroty · E2 Inscription ———
   Même identité que E3 : carte papier « La Fidélité by Paroty », ton jeune (stickers, ombres franches). */

.e2 {
  --anthracite: #2E3439;
  --anthracite-fonce: #1F2428;
  --or: #C89B3F;
  --or-fonce: #9A7427;
  --olive: #8F8456;
  --olive-clair: #C9BE8C;
  --olive-fonce: #5E5530;
  --creme: #F4F1EA;
  --case: #F7F5F0;
  --blanc: #FFFFFF;
  --texte: #23282C;
  --texte-doux: #5C605F;
  --erreur: #A3261B;            /* rouge brique : lisible sur crème (6:1) */

  --script: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --serif: 'Fraunces', 'Bitter', Georgia, serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--creme);
  color: var(--texte);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.e2 *, .e2 *::before, .e2 *::after { box-sizing: border-box; }
:where(.e2) :where(p, h1, ol) { margin: 0; padding: 0; }

/* ——— En-tête (identique à E3) ——— */
.e2__header {
  position: relative;
  z-index: 2;
  padding: 10px 20px;
  color: var(--blanc);
  background:
    linear-gradient(100deg, transparent 0 46%, rgba(200, 155, 63, 0.55) 46% 88%, transparent 88%),
    var(--anthracite);
}
.e2__brand-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  max-width: 440px; margin: 0 auto;
}
.e2__logo { display: block; width: 118px; height: auto; }
.e2__brand { line-height: 1; text-align: right; }
.e2__brand-script { font-family: var(--script); font-size: 38px; font-weight: 700; line-height: 0.95; }
.e2__brand-by {
  margin-top: 2px; font-size: 12px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase;
}
.e2__badge {
  position: absolute; bottom: -44px; right: 12px; z-index: 2;
  display: grid; place-items: center; width: 58px; padding: 10px 4px 12px;
  background: var(--anthracite-fonce);
  clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
  line-height: 1; transform: rotate(4deg);
}
.e2__badge-pct { font-size: 14px; font-weight: 800; color: var(--or); }
.e2__badge-word { font-family: var(--script); font-size: 17px; font-weight: 700; color: var(--blanc); }

/* ——— Formulaire = tout l'écran (le bouton du bas soumet, « Entrée » aussi) ——— */
.e2__form { flex: 1; display: flex; flex-direction: column; }

.e2__main {
  flex: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 6px 16px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

/* Pastille chrono (même famille que « Passage enregistré ») */
.e2__chrono {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 3px 14px 3px 3px;
  border-radius: 999px;
  background: var(--blanc);
  border: 2px solid var(--anthracite);
  box-shadow: 3px 3px 0 var(--anthracite);
  color: var(--anthracite);
  font-weight: 800; font-size: 14px;
  transform: rotate(-2deg);
}
.e2__chrono-icon {
  display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
  background: var(--or); color: var(--anthracite);
}
.e2__chrono-hand { transform-origin: 12px 13.5px; }

/* Titre */
.e2__title { display: flex; flex-direction: column; align-items: center; line-height: 1; color: var(--anthracite); }
.e2__title-small {
  font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--olive);
}
.e2__title-big { position: relative; margin-top: 2px; font-family: var(--script); font-size: 33px; font-weight: 700; }
.e2__squiggle {
  position: absolute; left: -3%; bottom: -6px; width: 106%; height: 10px; color: var(--or);
}

/* ——— Mini-carte (aperçu en direct) ——— */
.e2__mini {
  width: 100%;
  margin-top: 4px;
  padding: 9px 14px 7px;
  border-radius: 14px;
  color: var(--blanc);
  background:
    linear-gradient(var(--olive), var(--olive)) top / 100% 5px no-repeat,
    repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 7px),
    var(--anthracite);
  box-shadow: 0 5px 0 var(--or-fonce);
  transform: rotate(-1.5deg);
}
.e2__mini-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.e2__mini-name {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--olive-clair);
}
.e2__mini-prenom {
  display: inline-block;
  font-family: var(--script); font-size: 26px; font-weight: 700; letter-spacing: 0; color: var(--blanc);
  animation: e2-bump 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
.e2__mini-count {
  flex: none; font-family: var(--serif); font-size: 15px; font-weight: 600;
  color: rgba(255,255,255,0.65); font-variant-numeric: tabular-nums;
}
.e2__mini-count strong { font-size: 24px; color: var(--or); }
.e2__mini-cells {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 4px;
  margin-top: 6px;
}
.e2__mini-cell {
  position: relative;
  display: grid; place-items: center;
  aspect-ratio: 1;
  border-radius: 6px;
  background: var(--case);
}
.e2__mini-cell:last-child { box-shadow: inset 0 0 0 2px var(--or); }
.e2__mini-stamp {
  display: grid; place-items: center;
  width: 90%; aspect-ratio: 1; border-radius: 50%;
  background: var(--or); box-shadow: inset 0 0 0 1.5px var(--or-fonce);
}
.e2__mini-stamp img { width: 72%; height: auto; }
.e2__mini-reward {
  margin-top: 5px;
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--olive-clair); text-align: center;
}

/* ——— Champs ——— */
.e2__fields { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.e2__field { display: flex; flex-direction: column; gap: 3px; text-align: left; }
.e2__label { font-size: 15px; font-weight: 700; color: var(--anthracite); }
.e2__input-wrap { position: relative; }
.e2__input {
  width: 100%;
  min-height: 50px;
  padding: 0 48px 0 14px;
  border-radius: 12px;
  border: 2px solid var(--anthracite);
  background: var(--blanc);
  color: var(--texte);
  font: 600 18px/1 var(--sans);     /* ≥ 16 px : pas de zoom automatique sur iPhone */
  letter-spacing: 0.02em;
  transition: box-shadow 120ms, border-color 120ms;
}
.e2__input::placeholder { color: #A6A29A; font-weight: 500; }
.e2__input:focus { outline: none; box-shadow: 0 0 0 4px rgba(200, 155, 63, 0.45); }
.e2__field.has-error .e2__input { border-color: var(--erreur); }
.e2__field.has-error .e2__input:focus { box-shadow: 0 0 0 4px rgba(163, 38, 27, 0.2); }

/* Sticker ✓ collé dans le champ valide */
.e2__ok {
  position: absolute; right: 12px; top: 50%;
  display: grid; place-items: center;
  width: 26px; height: 26px; margin-top: -13px;
  border-radius: 50%;
  background: var(--or); color: var(--anthracite);
  box-shadow: 2px 2px 0 var(--anthracite);
  animation: e2-sticker 380ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.e2__error { font-size: 14px; font-weight: 600; color: var(--erreur); }
.e2__help { font-size: 13px; color: var(--texte-doux); }

/* Case à cocher SMS (facultative, décochée par défaut). Consentement recueilli dès le pilote,
   aucun SMS envoyé en V1. */
.e2__optin {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  min-height: 36px;
  font-size: 15px; line-height: 1.25; text-align: left; color: var(--texte);
  cursor: pointer;
}
.e2__optin em { font-style: normal; color: var(--texte-doux); }
.e2__optin input { position: absolute; opacity: 0; width: 28px; height: 28px; margin: 0; }
.e2__optin-box {
  flex: none;
  display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: 8px;
  border: 2px solid var(--anthracite); background: var(--blanc);
  color: transparent;
  transition: background-color 120ms, color 120ms, transform 160ms;
}
.e2__optin input:checked + .e2__optin-box {
  background: var(--or); color: var(--anthracite); transform: rotate(-6deg) scale(1.05);
}
.e2__optin input:focus-visible + .e2__optin-box { box-shadow: 0 0 0 4px rgba(200, 155, 63, 0.45); }

/* ——— Bas d'écran ——— */
.e2__actions {
  position: sticky;
  bottom: 0;
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px 16px calc(6px + env(safe-area-inset-bottom));
  background: var(--blanc);
  border-top: 1px solid rgba(46, 52, 57, 0.12);
}
.e2__actions > * { width: 100%; max-width: 440px; margin: 0 auto; }

.e2__btn {
  position: relative;
  overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px;
  padding: 0 20px;
  border-radius: 14px;
  border: 2px solid var(--anthracite);
  background: var(--anthracite);
  color: var(--blanc);
  box-shadow: 0 4px 0 var(--or-fonce);
  font: 800 18px/1 var(--sans);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform 80ms, box-shadow 80ms, background-color 200ms, color 200ms;
}
.e2__btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--or-fonce); }
.e2__btn:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
.e2__btn:disabled { cursor: default; }
.e2.is-reussite .e2__btn { background: var(--or); border-color: var(--or-fonce); color: var(--anthracite); }

.e2__spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.3); border-top-color: var(--or);
  animation: e2-spin 700ms linear infinite;
}

.e2__alert {
  padding: 8px 12px; border-radius: 10px;
  background: #F6E3DF; color: var(--erreur);
  font-size: 14px; font-weight: 600; text-align: center;
}
.e2__legal { font-size: 12px; line-height: 1.3; color: var(--texte-doux); text-align: center; }
.e2__legal a { color: var(--anthracite); font-weight: 600; text-underline-offset: 2px; }

/* ═══════════ Chorégraphie ═══════════ */
.e2__chrono { animation: e2-pop 450ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.e2__chrono-hand { animation: e2-tick 1200ms cubic-bezier(0.5, 0, 0.3, 1) 200ms both; }
.e2__title-small { animation: e2-rise 400ms ease-out 150ms both; }
.e2__title-big { animation: e2-rise 450ms cubic-bezier(0.34, 1.4, 0.64, 1) 220ms both; }
.e2__squiggle path {
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: e2-draw 600ms ease-in-out 500ms forwards;
}
.e2__mini { animation: e2-drop 650ms cubic-bezier(0.34, 1.4, 0.64, 1) 350ms both; }
.e2__mini-cell { animation: e2-cell 300ms cubic-bezier(0.34, 1.56, 0.64, 1) calc(600ms + var(--i) * 40ms) both; }
.e2__field, .e2__optin { animation: e2-rise 420ms ease-out var(--d, 800ms) both; }
.e2__fields.is-shaking { animation: e2-shake 420ms ease-in-out; }

/* Réussite : tampon sur la 1re case, confettis, la carte sautille */
.e2.is-reussite .e2__mini { animation: e2-hop 500ms ease-out 250ms; }
.e2__mini-stamp { animation: e2-slam 600ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.e2__burst { position: absolute; inset: 0; pointer-events: none; }
.e2__burst span {
  position: absolute; top: 50%; left: 50%;
  width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 2px;
  background: var(--or); opacity: 0;
  animation: e2-burst 700ms ease-out 300ms both;
}
.e2__burst span:nth-child(even) { background: var(--olive-clair); border-radius: 50%; }
.e2.is-reussite .e2__btn { animation: e2-bump 450ms cubic-bezier(0.34, 1.56, 0.64, 1); }

@keyframes e2-pop {
  0% { transform: scale(0.6) rotate(-8deg); opacity: 0; }
  100% { transform: scale(1) rotate(-2deg); opacity: 1; }
}
@keyframes e2-tick { from { transform: rotate(-360deg); } to { transform: rotate(0); } }
@keyframes e2-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes e2-draw { to { stroke-dashoffset: 0; } }
@keyframes e2-drop {
  0%   { opacity: 0; transform: translateY(-30px) rotate(6deg); }
  60%  { opacity: 1; transform: translateY(4px) rotate(-3deg); }
  100% { transform: rotate(-1.5deg); }
}
@keyframes e2-cell { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: none; } }
@keyframes e2-bump {
  0% { transform: scale(0.7); } 60% { transform: scale(1.12); } 100% { transform: none; }
}
@keyframes e2-sticker {
  0% { opacity: 0; transform: scale(0.2) rotate(-40deg); }
  100% { opacity: 1; transform: scale(1) rotate(-8deg); }
}
@keyframes e2-shake {
  0%, 100% { transform: none; }
  20% { transform: translateX(-8px); } 40% { transform: translateX(7px); }
  60% { transform: translateX(-4px); } 80% { transform: translateX(3px); }
}
@keyframes e2-hop {
  0%, 100% { transform: rotate(-1.5deg); }
  40% { transform: translateY(-8px) rotate(1deg); }
}
@keyframes e2-slam {
  0%   { opacity: 0; transform: scale(3) rotate(-40deg); }
  55%  { opacity: 1; transform: scale(0.85) rotate(-8deg); }
  100% { transform: scale(1) rotate(-8deg); }
}
@keyframes e2-burst {
  0%   { transform: rotate(var(--a)) translateY(0); opacity: 0; }
  10%  { opacity: 1; }
  100% { transform: rotate(var(--a)) translateY(-30px) scale(0.4); opacity: 0; }
}
@keyframes e2-spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .e2 *, .e2 *::before, .e2 *::after { animation: none !important; transition: none !important; }
  .e2__squiggle path { stroke-dashoffset: 0; }
  .e2__spinner { border-top-color: var(--or); }
}

/* ——— Maison Paroty · E3 Passage enregistré ———
   Identité : carte papier « La Fidélité by Paroty » (anthracite, or, olive)
   Ton : jeune — stickers, ombres franches, confettis. Ni néomorphisme ni glassmorphism. */

.e3 {
  --anthracite: #2E3439;        /* fond de la carte papier */
  --anthracite-fonce: #1F2428;
  --or: #C89B3F;
  --or-fonce: #9A7427;          /* anneau des tampons : contraste ≥ 3:1 */
  --olive: #8F8456;             /* bandeau olive de la carte */
  --olive-clair: #C9BE8C;
  --creme: #F4F1EA;
  --case: #F7F5F0;              /* cases blanches de la carte */
  --blanc: #FFFFFF;
  --brun: #8B4513;              /* accent chaud, utilisé avec parcimonie */
  --texte: #23282C;

  --script: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --serif: 'Fraunces', 'Bitter', Georgia, serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--creme);
  color: var(--texte);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.e3 *,
.e3 *::before,
.e3 *::after { box-sizing: border-box; }

:where(.e3) :where(p, h1, ol) { margin: 0; padding: 0; }

.e3__sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ——— En-tête (carte papier) ——— */
.e3__header {
  position: relative;
  z-index: 2;
  padding: 10px 20px;
  color: var(--blanc);
  background:
    linear-gradient(100deg,
      transparent 0 46%,
      rgba(200, 155, 63, 0.55) 46% 88%,
      transparent 88%),
    var(--anthracite);
}
.e3__brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 440px;
  margin: 0 auto;
}
.e3__logo {
  display: block;
  width: 118px;
  height: auto;
}
.e3__brand { line-height: 1; text-align: right; }
.e3__brand-script {
  font-family: var(--script);
  font-size: 38px;
  font-weight: 700;
  line-height: 0.95;
}
.e3__brand-by {
  margin-top: 2px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.e3__badge {
  position: absolute;
  bottom: -44px;
  right: 12px;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 58px;
  padding: 10px 4px 12px;
  background: var(--anthracite-fonce);
  clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
  line-height: 1;
  transform: rotate(4deg);
}
.e3__badge-pct { font-size: 14px; font-weight: 800; color: var(--or); }
.e3__badge-word { font-family: var(--script); font-size: 17px; color: var(--blanc); font-weight: 700; }

/* ——— Contenu ——— */
.e3__main {
  flex: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 10px 16px 0;
  text-align: center;
}

/* Pastille « sticker » */
.e3__success {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  background: var(--blanc);
  border: 2px solid var(--anthracite);
  box-shadow: 3px 3px 0 var(--anthracite);
  color: var(--anthracite);
  font-weight: 800;
  font-size: 15px;
  transform: rotate(-2deg);
  animation: e3-pop 450ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.e3__success-icon {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--or);
  color: var(--anthracite);
}

/* « Bonjour Marie » : petit + gros manuscrit souligné */
.e3__hello {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  color: var(--anthracite);
}
.e3__hello-small {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--olive);
}
.e3__hello-name {
  position: relative;
  margin-top: 2px;
  font-family: var(--script);
  font-size: 42px;
  font-weight: 700;
}
.e3__squiggle {
  position: absolute;
  left: -4%;
  bottom: -6px;
  width: 108%;
  height: 10px;
  color: var(--or);
}

/* ——— Carte de progression (intérieur de la carte papier) ——— */
.e3__card {
  margin-top: 14px;
  padding: 18px 12px 12px;
  border-radius: 18px;
  color: var(--blanc);
  background:
    linear-gradient(var(--olive), var(--olive)) top / 100% 6px no-repeat,
    repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 7px),
    var(--anthracite);
  box-shadow: 0 6px 0 var(--or-fonce);   /* ombre franche, effet carte posée */
  position: relative;
}

.e3__card-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 0 4px;
  text-align: left;
}
.e3__card-title { line-height: 1.05; }
.e3__card-script {
  display: block;
  font-family: var(--script);
  font-size: 30px;
  font-weight: 700;
}
.e3__card-caps {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--olive-clair);
}
.e3__count {
  flex: none;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.65);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.e3__count-value {
  font-size: 42px;
  font-weight: 700;

/* Grille 5 × 2 */
.e3__stamps {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}
.e3__cell {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  border-radius: 12px;
  background: var(--case);
}
.e3__cell-num {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;

.e3__stamp {
  --tilt: -6deg;
  position: relative;
  display: grid;
  place-items: center;
  width: 82%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--or);
  box-shadow: inset 0 0 0 2px var(--or-fonce);
  transform: rotate(var(--tilt));
}
.e3__stamp::after {
  content: '';
  position: absolute;
  inset: 14%;
  border-radius: 50%;
  border: 1.5px dashed rgba(255, 255, 255, 0.55);
}
.e3__stamp-mp {
  position: relative;
  z-index: 1;
  width: 70%;
  height: auto;
}

/* Dernier tampon : scale + glow doré, puis confettis */
.e3__cell.is-new .e3__stamp {
  animation:
    e3-stamp-in 650ms cubic-bezier(0.34, 1.56, 0.64, 1) 350ms both,
    e3-glow 1400ms ease-out 900ms 2;
}
.e3__burst {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.e3__burst span {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 2px;
  background: var(--or);
  opacity: 0;
  animation: e3-burst 700ms ease-out 650ms both;
}
.e3__burst span:nth-child(even) { background: var(--olive-clair); border-radius: 50%; }

@keyframes e3-pop {
  0%   { transform: scale(0.6) rotate(-8deg); opacity: 0; }
  100% { transform: scale(1) rotate(-2deg); opacity: 1; }
}
@keyframes e3-stamp-in {
  0%   { transform: scale(2.2) rotate(calc(var(--tilt) - 30deg)); opacity: 0; }
  55%  { transform: scale(0.9) rotate(var(--tilt)); opacity: 1; }
  75%  { transform: scale(1.15) rotate(var(--tilt)); }
  100% { transform: scale(1) rotate(var(--tilt)); }
}
@keyframes e3-glow {
  0%   { box-shadow: inset 0 0 0 2px var(--or-fonce), 0 0 0 0 rgba(200, 155, 63, 0.9); }
  70%  { box-shadow: inset 0 0 0 2px var(--or-fonce), 0 0 0 12px rgba(200, 155, 63, 0); }
  100% { box-shadow: inset 0 0 0 2px var(--or-fonce), 0 0 0 0 rgba(200, 155, 63, 0); }
}
@keyframes e3-burst {
  0%   { transform: rotate(var(--a)) translateY(0) scale(1); opacity: 0; }
  10%  { opacity: 1; }

}

}

  background: var(--creme);

  /* ═══════════ Appels au guichet ═══════════ */
  const ERREUR_RESEAU = "La connexion a coupé. Vos infos sont toujours là : réessayez.";
  function appeler(corps) {
    if (!CONFIG.GUICHET_URL) return Promise.reject(new Error("guichet non configuré"));
    const ctrl = new AbortController();
    const minuteur = setTimeout(() => ctrl.abort(), CONFIG.DELAI_MS);
    return fetch(CONFIG.GUICHET_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ magasin: CONFIG.MAGASIN }, corps)),
      signal: ctrl.signal
    }).then(rep => {
      if (!rep.ok) throw new Error("http " + rep.status);
      return rep.json();
    }).finally(() => clearTimeout(minuteur));
  }
  const colonnes = n => (n <= 5 ? n : n === 10 ? 5 : Math.ceil(n / 2));
  function majCarte(r) {
    if (r.prenom) S.prenom = r.prenom;

    if (r.seuil) OBJ = r.seuil;
    S.attente = r.recompense_en_attente === true;
  }
  function memoriserClient(r) {
    if (r.identifiant) { S.id = r.identifiant; S.persiste = ecrireId(r.identifiant); }
    majCarte(r);
  }

  /* ——— Réponse du guichet → bon écran ——— */
  function traiter(r, recupere) {
    const petit = recupere ? "Heureux de vous revoir" : undefined;
    if (r.statut === "ok" || r.statut === "deja_compte" || r.statut === "recompense_debloquee") {
      majCarte(r);
      if (r.statut === "ok") return carte({ pastille: "Passage enregistré", petit, nouveau: true });
      if (r.statut === "deja_compte") return carte({ pastille: "Déjà compté aujourd’hui", petit, calme: true, ticket: "Un passage par jour maximum. <strong>À bientôt</strong> !" });
      return recompense(r.nouvelle_recompense === true);
    }
    if (r.statut === "client_inconnu") { oublierId(); return inscription(); }
    if (r.statut === "bloque_recuperation") return blocage(r);
    if (r.statut === "plafond" || r.statut === "occupe") return panne(r.message);
    return panne();
  }

      const prenom = nettoyerPrenom(p.value);
      if (prenom.length < 2) { alerte.textContent = "Indiquez votre prénom (2 lettres minimum)."; alerte.hidden = false; p.focus(); return; }
      alerte.hidden = true; btn.disabled = true; racine.className = "e2 is-envoi";
      btn.innerHTML = '<span class="e2__spinner" aria-hidden="true"></span>Recherche de votre carte…';
      const fin = msg => { btn.disabled = false; racine.className = "e2 is-erreur"; btn.textContent = "Retrouver ma carte"; alerte.textContent = msg; alerte.hidden = false; };
      appeler({ action: "recuperer", telephone: tel, prenom }).then(r => {
        if (r.statut === "ok" || r.statut === "deja_compte" || r.statut === "recompense_debloquee") {
          memoriserClient(r);
          return traiter(r, true);
        }
        if (r.statut === "bloque_recuperation") return blocage(r);
        if (r.statut === "client_inconnu") return inscription();
        fin(r.message || ERREUR_RESEAU);
      }).catch(() => fin(ERREUR_RESEAU));
    });
  }

  /* ═══════════ E8 · Trop d'essais : blocage 1 heure ═══════════ */
  function blocage(r) {
    app.innerHTML = `
    <div class="e3">
      ${ENTETE("e3")}
      <main class="e3__main">
        <p class="e3__success e3__success--calme" role="status"><span class="e3__success-icon">!</span>Trop d’essais</p>
        <h1 class="e3__hello"><span class="e3__hello-small">On fait une pause</span><span class="e3__hello-name">Réessayez plus tard${SQUIGGLE}</span></h1>
        <div class="v0__bloc">
          <strong>Votre carte n’est pas perdue.</strong>
          <p>Réessayez dans environ ${r.minutes_restantes || 60} minutes, ou demandez de l’aide à l’équipe.</p>
        </div>
      </main>
    </div>`;
    window.scrollTo(0, 0);
  }

  scanner();
})();
</script>
